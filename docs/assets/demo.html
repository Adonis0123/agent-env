<!doctype html>
<!--
  README demo scene. scripts/record-demo.ts runs the real commands on the demo manifest (examples/demo) with a
  throwaway HOME, passes what they print in `?data=` together with a fresh panel screenshot in the same theme, then
  seeks the timeline below frame by frame into docs/assets/demo.gif. The scene is light unless `?theme=dark`
  asks for the dark set (kept for a look, not shipped). Every state is a pure function of the time t, so a seek
  always draws the same frame. No third-party code: plain CSS and the script at the end.
  Opened by hand without `?data=`, it only says how to fill it.
-->

  <body>
    <div id="stage"><div id="grid"></div><div id="glow"></div></div>
    <script>
      const stage = document.getElementById('stage')
      const params = new URLSearchParams(location.search)
      // ?theme=light|dark picks the colour set above; light when not given.
      document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light'
      const data = params.has('data') ? JSON.parse(params.get('data')) : null

      // ── time helpers: every state below is a function of t alone ──
      const clamp = (x) => Math.min(1, Math.max(0, x))
      const prog = (t, a, b) => clamp((t - a) / (b - a))
      const ease = (x) => 1 - (1 - x) ** 3
      const inOut = (t, a, b, c, d) => Math.min(ease(prog(t, a, b)), 1 - ease(prog(t, c, d)))
      const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))

      function el(tag, attrs = {}, parent = stage) {
        const node = document.createElement(tag)
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'html') node.innerHTML = v
          else if (k === 'text') node.textContent = v
          else if (k === 'style') Object.assign(node.style, v)
          else node.setAttribute(k, v)
        }
        parent.appendChild(node)
        return node
      }
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      // East Asian wide characters take two terminal columns; the CLI aligns its tables that way.
      const WIDE =
        /[ᄀ-ᅟ⺀-〾ぁ-㏿㐀-䶿一-鿿ꀀ-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦]/
      const cells = (s) => [...s].map((ch) => (WIDE.test(ch) ? `<span class="w">${esc(ch)}</span>` : esc(ch))).join('')

      // Colour a line of CLI output; the words stay exactly as printed.
      const STATE = { 已同步: 'pass', 已定制: 'info', 缺失: 'fail', 不一致: 'warn', 未知: 'muted' }
      function paint(line) {
        const segs = []
        let rest = line
        let m
        if ((m = /^(PASS|WARN|FAIL)( .*)?$/.exec(line))) {
          segs.push([m[1], m[1].toLowerCase()])
          rest = m[2] ?? ''
        } else if ((m = /^(\s+)(已同步|已定制|缺失|不一致|未知)(.*)$/.exec(line))) {
          segs.push([m[1], ''], [m[2], STATE[m[2]]])
          rest = m[3]
        } else if (/^(落点|环境|合计|清单检查)/.test(line)) {
          segs.push([line, 'strong'])
          rest = ''
        } else if (/^#/.test(line)) {
          segs.push([line, 'head'])
          rest = ''
        } else if (/^<!--/.test(line)) {
          segs.push([line, 'muted'])
          rest = ''
        }
        const fix = rest.indexOf('修复：')
        if (fix >= 0) segs.push([rest.slice(0, fix), ''], [rest.slice(fix), 'fix'])
        else segs.push([rest, ''])
        return segs.map(([s, c]) => (c ? `<span class="${c}">${cells(s)}</span>` : cells(s))).join('')
      }

      // A terminal whose commands are typed and whose output lines appear on a schedule.
      // steps: {cmd, dur} types a command; {out: [...], every} prints lines; {wait} pauses.
      function terminal(box, title, start, steps, { size = 13, lh = 19, wrap = false } = {}) {
        const t = el('div', { class: `term${wrap ? ' wrap' : ''}`, style: box })
        const bar = el('div', { class: 'tbar' }, t)
        ;['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) =>
          el('i', { style: { left: `${14 + i * 16}px`, background: `${c}aa` } }, bar),
        )
        el('b', { text: title }, bar)
        const body = el('div', { class: 'body' }, t)
        const lines = el('div', { class: 'lines', style: { fontSize: `${size}px`, lineHeight: `${lh}px` } }, body)
        const rows = []
        let at = start
        for (const s of steps) {
          if (s.wait) at += s.wait
          else if (s.cmd != null) {
            rows.push({ node: el('div', {}, lines), cmd: s.cmd, t0: at, t1: at + s.dur })
            at += s.dur + 0.2
          } else if (s.out) {
            for (const line of s.out) {
              rows.push({ node: el('div', { html: (s.raw ? line : paint(line)) || '&nbsp;' }, lines), t0: at })
              at += s.every
            }
          }
        }
        const capacity = Math.floor((parseFloat(box.height) - 32 - 24) / lh)
        return {
          node: t,
          end: at,
          update(now) {
            let shown = 0
            for (const r of rows) {
              const on = now >= r.t0
              r.node.style.display = on ? '' : 'none'
              if (!on) continue
              shown++
              if (r.cmd != null) {
                const n = Math.round(r.cmd.length * prog(now, r.t0, r.t1))
                const typing = now < r.t1 + 0.2
                r.node.innerHTML = `<span class="prompt">$</span> <span class="cmd">${cells(r.cmd.slice(0, n))}</span>${typing ? '<span class="cursor">_</span>' : ''}`
              }
            }
            lines.style.transform = wrap ? '' : `translateY(${-Math.max(0, shown - capacity) * lh}px)`
          },
        }
      }

      function caption(kick, en, zh) {
        const c = el('div', { class: 'cap' })
        el('span', { class: 'kick', text: kick }, c)
        el('span', { class: 'en', text: en }, c)
        el('span', { class: 'zh', text: zh }, c)
        return c
      }
      const fade = (node, o, dy = 0, scale = 1) => {
        node.style.opacity = o
        node.style.transform = `translateY(${dy}px) scale(${scale})`
        node.style.visibility = o <= 0.001 ? 'hidden' : 'visible'
      }

      function build(d) {
        const parts = []
        const S1 = 0,
          S2 = 5.2,
          S3 = 11.4,
          S4 = 17.6,
          END = 25

        // Step pills (top right)
        const steps = el('div', { id: 'steps' })
        const pills = ['1 痛点', '2 清单', '3 送达', '4 体检'].map((s) => el('span', { text: s }, steps))
        const bounds = [S1, S2, S3, S4, END]
        parts.push((t) => {
          fade(steps, prog(t, 0.2, 0.7))
          pills.forEach((p, i) => {
            const on = t >= bounds[i] && t < bounds[i + 1]
            p.style.color = on ? 'var(--on-accent)' : ''
            p.style.background = on ? 'var(--accent)' : ''
            p.style.borderColor = on ? 'var(--accent)' : ''
          })
        })

        // ── Scene 1 ──
        const cap1 = caption('1 / 4  THE PROBLEM', 'Every agent keeps its own copy of the rules', '每个 agent 各存一份规则文件，手抄迟早漂移')
        const cards = [
          { env: 'mac · laptop', host: 'Claude Code', path: '~/.claude/AGENTS.md', color: 'var(--public)' },
          { env: 'mac · laptop', host: 'Codex', path: '~/.codex/AGENTS.md', color: 'var(--public)', drift: [2] },
          { env: 'wsl', host: 'Claude Code', path: '~/.claude/AGENTS.md', color: 'var(--personal)' },
          { env: 'vps-helper · server', host: 'Hermes bot', path: '~/.hermes/workspace/AGENTS.md', color: 'var(--company)', gone: [4, 5] },
          { env: 'grok-bot · cloud', host: 'Grok bot', path: 'memory, in the app', color: 'var(--local)', drift: [1] },
        ].map((c, i) => {
          const node = el('div', { class: 'card', style: { left: `${50 + i * 240}px` } })
          el('div', { class: 'env', text: c.env, style: { color: c.color } }, node)
          el('div', { class: 'host', text: c.host }, node)
          el('div', { class: 'path', text: c.path }, node)
          const doc = el('div', { class: 'doc' }, node)
          const widths = [70, 130, 110, 140, 90, 120, 60]
          const bars = widths.map((w, j) => el('i', { style: { top: `${16 + j * 21}px`, width: `${w}px` } }, doc))
          const badge = c.drift || c.gone ? el('div', { class: 'badge', text: c.gone ? '≠ 2 rules missing' : '≠ drifted' }, node) : null
          return { node, bars, badge, c }
        })
        const note = el('div', {
          id: 's1note',
          html: 'Copied by hand from one file to the next, <b>they drift apart</b> · 手抄一份改一份，很快就对不上',
        })
        parts.push((t) => {
          const out = 1 - ease(prog(t, S2 - 0.5, S2))
          fade(cap1, Math.min(ease(prog(t, 0.1, 0.6)), out), 0)
          cards.forEach((k, i) => {
            const a = ease(prog(t, 0.4 + i * 0.22, 0.9 + i * 0.22))
            fade(k.node, Math.min(a, out), (1 - a) * 24 - (1 - out) * 16)
            const drift = ease(prog(t, 2.5 + i * 0.12, 3.1 + i * 0.12))
            k.bars.forEach((b, j) => {
              const bad = k.c.drift?.includes(j)
              const gone = k.c.gone?.includes(j)
              b.style.background = bad && drift > 0.5 ? 'var(--fail)' : ''
              b.style.transform = bad ? `translateX(${drift * 18}px)` : ''
              b.style.opacity = gone ? 1 - drift * 0.85 : 1
            })
            if (k.badge) fade(k.badge, drift, (1 - drift) * 6)
            k.node.style.borderColor = k.badge && drift > 0.5 ? 'var(--drift-line)' : ''
          })
          fade(note, Math.min(ease(prog(t, 3.2, 3.8)), out))
        })

        // ── Scene 2 ──
        const cap2 = caption(
          '2 / 4  ONE MANIFEST',
          'One manifest, plugins with a visibility, stacked in order',
          '一份清单（manifest/habits.toml）+ 带可见性的插件，按顺序叠加',
        )
        const t2 = terminal(
          { left: '40px', top: '140px', width: '820px', height: '590px' },
          'agent-env — check · plugin build',
          S2 + 0.6,
          [
            { out: [`M=${d.manifest}`], every: 0 },
            { cmd: d.check.cmd, dur: 0.8 },
            { out: d.check.lines, every: 0.11 },
            { wait: 0.3 },
            { cmd: d.build.cmd, dur: 0.6 },
            { out: d.build.lines, every: 0.12 },
          ],
        )
        const file = el('div', { id: 'file', html: `manifest/habits.toml<small>targets · environments · plugins · rule sections</small>` })
        const layers = [
          { n: 'demo-public', v: 'public', d: 'Shared rules and a demo skill', c: 'var(--public)' },
          { n: 'demo-personal', v: 'personal', d: "The demo user's own workflow", c: 'var(--personal)' },
          { n: 'demo-company', v: 'company', d: 'Rules and skills for the team server', c: 'var(--company)' },
          { n: 'demo-mac', v: 'local', d: 'Patch layer of the laptop', c: 'var(--local)' },
        ].map((l, i) => {
          const node = el('div', { class: 'slab', style: { top: `${222 + i * 66}px`, borderLeftColor: l.c } })
          el('div', { class: 'n', text: l.n }, node)
          el('div', { class: 'd', text: l.d }, node)
          el('div', { class: 'v', text: l.v, style: { background: l.c } }, node)
          return { node, l }
        })
        const order = el('div', { id: 'order', text: 'later plugins append · 后面的插件接在前面之后；local 是本机补丁层，从不推送' })
        const pick = el('div', {
          id: 'pick',
          html: `<b>mac/claude-code</b> = demo-public<br>&nbsp;&nbsp;→ demo-personal → demo-mac<br><span class="muted">composed into ~/.claude/AGENTS.md</span>`,
        })
        parts.push((t) => {
          const vis = inOut(t, S2, S2 + 0.5, S3 - 0.5, S3)
          fade(cap2, vis)
          fade(t2.node, vis, (1 - ease(prog(t, S2 + 0.1, S2 + 0.6))) * 20)
          t2.update(t)
          fade(file, Math.min(vis, ease(prog(t, S2 + 0.8, S2 + 1.2))))
          const pickT = ease(prog(t, S2 + 4.3, S2 + 4.8))
          layers.forEach((k, i) => {
            const a = ease(prog(t, S2 + 1.3 + i * 0.45, S2 + 1.8 + i * 0.45))
            fade(k.node, Math.min(vis, a) * (k.l.n === 'demo-company' ? 1 - pickT * 0.7 : 1), 0)
            k.node.style.transform = `translateX(${(1 - a) * 60}px)`
            k.node.style.boxShadow =
              k.l.n !== 'demo-company' && pickT > 0 ? `0 0 0 ${pickT}px ${k.l.c}, var(--card-shadow)` : ''
          })
          fade(order, Math.min(vis, ease(prog(t, S2 + 3.3, S2 + 3.7))))
          fade(pick, Math.min(vis, pickT), (1 - pickT) * 10)
        })

        // ── Scene 3 ──
        const cap3 = caption(
          '3 / 4  DELIVERY',
          'Three ways to deliver',
          '本机合成 AGENTS.md · 服务器 systemd 定时器自己拉 · 云端 bot 按一条指路规则自己拉',
        )
        const hub = el('div', { id: 'hub', text: 'manifest/habits.toml' })
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        svg.id = 'wires'
        stage.appendChild(svg)
        const colX = [40, 450, 860]
        const colors = ['var(--public)', 'var(--company)', 'var(--local)']
        const wires = colX.map((x, i) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          const sx = 560 + i * 80
          const ex = x + 190
          p.setAttribute('d', `M${sx},180 C${sx},205 ${ex},195 ${ex},220`)
          p.setAttribute('fill', 'none')
          p.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue(colors[i].slice(4, -1)).trim())
          p.setAttribute('stroke-width', '2')
          p.setAttribute('pathLength', '1')
          p.setAttribute('stroke-dasharray', '1')
          svg.appendChild(p)
          return p
        })
        function column(i, title, zh) {
          const c = el('div', { class: 'col', style: { left: `${colX[i]}px` } })
          const h = el('div', { class: 'h' }, c)
          el('span', { class: 't', text: title, style: { color: colors[i] } }, h)
          el('span', { class: 'z', text: zh }, h)
          return c
        }
        const c1 = column(0, 'Laptop · composed here', '本机：按插件顺序合成')
        const c2 = column(1, 'Server · pulls on a timer', '服务器：systemd 用户定时器自己 git pull')
        const c3 = column(2, 'Cloud bot · one pointer rule', '云端 bot：存一条指路规则，它自己拉')
        const T1 = S3 + 0.6,
          T2 = S3 + 2.1,
          T3 = S3 + 3.6
        const k1 = terminal({ left: '0', top: '58px', width: '380px', height: '448px' }, 'render', T1, [
          { cmd: d.render.cmd, dur: 0.6 },
          { out: d.render.lines, every: 0.05 },
        ], { size: 12, lh: 17 })
        c1.appendChild(k1.node)
        const foot1 = el('div', { class: 'foot', html: `<span class="pass">→</span> ${esc(d.render.output)}` }, k1.node)
        foot1.style.background = 'var(--term)'
        const k2 = terminal({ left: '0', top: '58px', width: '380px', height: '448px' }, 'vps-helper/hermes', T2, [
          { out: ['# manifest/habits.toml, [[targets]] vps-helper/hermes'], every: 0.1 },
          { out: [d.pull], every: 0.3 },
          { cmd: d.check.cmd, dur: 0.5 },
          { out: [d.remote], every: 0.3 },
        ], { size: 12, lh: 17, wrap: true })
        c2.appendChild(k2.node)
        const clock = el('div', { class: 'clock' }, k2.node)
        const hand = el('i', {}, clock)
        const clockNote = el('div', { class: 'foot', html: '<span style="color:var(--company)">systemd user timer</span><br><span class="muted">agent-env-pull.timer → git pull</span>' }, k2.node)
        clockNote.style.right = '90px'
        const k3 = terminal({ left: '0', top: '58px', width: '380px', height: '448px' }, 'pointer', T3, [
          { cmd: d.pointer.cmd, dur: 0.6 },
          { out: d.pointer.lines, every: 0.4 },
        ], { size: 12, lh: 17, wrap: true })
        c3.appendChild(k3.node)
        parts.push((t) => {
          const vis = inOut(t, S3, S3 + 0.5, S4 - 0.5, S4)
          fade(cap3, vis)
          fade(hub, vis, (1 - ease(prog(t, S3, S3 + 0.5))) * -10)
          wires.forEach((w, i) => {
            const a = ease(prog(t, [T1, T2, T3][i] - 0.5, [T1, T2, T3][i]))
            w.setAttribute('stroke-dashoffset', String(1 - a))
            w.style.opacity = vis
          })
          ;[c1, c2, c3].forEach((c, i) => {
            const a = ease(prog(t, [T1, T2, T3][i] - 0.3, [T1, T2, T3][i] + 0.2))
            fade(c, Math.min(vis, a), (1 - a) * 20)
          })
          k1.update(t)
          k2.update(t)
          k3.update(t)
          fade(foot1, ease(prog(t, k1.end, k1.end + 0.3)))
          const ck = ease(prog(t, k2.end, k2.end + 0.3))
          fade(clock, ck)
          fade(clockNote, ck)
          hand.style.transform = `rotate(${Math.max(0, t - T2) * 240}deg)`
        })

        // ── Scene 4 ──
        const cap4 = caption(
          '4 / 4  DOCTOR',
          'doctor checks every target; each finding says how to fix it',
          'doctor 逐个落点体检，每条发现都带「修复：」',
        )
        const cap5 = caption('4 / 4  PANEL', '…and the panel shows every environment on one page', '面板一页看全部环境，有问题的排在最前')
        const t4 = terminal(
          { left: '40px', top: '140px', width: '1200px', height: '590px' },
          'agent-env doctor',
          S4 + 0.6,
          [
            { cmd: d.doctor.cmd, dur: 0.7 },
            { out: d.doctor.lines, every: 0.05 },
          ],
        )
        const panel = el('div', { id: 'panel' })
        el('img', { src: d.panel, alt: '' }, panel)
        const outro = el('div', { id: 'outro', html: '<div>agent-env <span>· github.com/Adonis0123/agent-env</span></div>' })
        const P = S4 + 4.0
        parts.push((t) => {
          const vis = ease(prog(t, S4, S4 + 0.5))
          fade(cap4, Math.min(vis, 1 - ease(prog(t, P - 0.3, P))))
          fade(cap5, ease(prog(t, P, P + 0.4)))
          fade(t4.node, vis * (1 - 0.75 * ease(prog(t, P, P + 0.8))), (1 - vis) * 20)
          t4.update(t)
          const glow = inOut(t, t4.end, t4.end + 0.3, P - 0.2, P + 0.4)
          for (const f of t4.node.querySelectorAll('.fix')) f.style.background = `rgba(var(--fix-rgb), ${0.22 * glow})`
          const p = ease(prog(t, P, P + 0.9))
          panel.style.opacity = p
          panel.style.visibility = p > 0 ? 'visible' : 'hidden'
          panel.style.transform = `translateY(${(1 - p) * 90}px) rotateX(${(1 - p) * 12}deg) scale(${0.94 + 0.06 * p})`
          fade(outro, ease(prog(t, P + 1.5, P + 2)), (1 - ease(prog(t, P + 1.5, P + 2))) * 10)
        })

        return { total: END, update: (t) => parts.forEach((f) => f(t)), image: panel.querySelector('img') }
      }

      if (!data) {
        el('div', { id: 'empty', text: 'This scene is filled by scripts/record-demo.ts: node scripts/record-demo.ts --frames 3' })
        window.demo = { total: 0, ready: Promise.resolve(true), seek: async () => {} }
      } else {
        const scene = build(data)
        const loaded = scene.image.complete
          ? Promise.resolve()
          : new Promise((r) => scene.image.addEventListener('load', r, { once: true }))
        window.demo = {
          total: scene.total,
          ready: Promise.all([document.fonts.ready, loaded]).then(() => true),
          // Used by scripts/record-demo.ts: put the timeline at `t` seconds and wait for paint.
          async seek(t) {
            scene.update(t)
            await frame()
          },
        }
        scene.update(0)
        if (!params.has('record')) {
          // Opened by hand with data: play it in a loop.
          const t0 = performance.now()
          const tick = () => {
            scene.update(((performance.now() - t0) / 1000) % scene.total)
            requestAnimationFrame(tick)
          }
          requestAnimationFrame(tick)
        }
      }
    </script>
  </body>
</html>
