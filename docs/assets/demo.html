<!doctype html>
<!--
  README demo scene, light. scripts/record-demo.ts runs the real commands on the demo manifest (examples/demo) with a
  throwaway HOME, builds the scenes from what they print (English or Chinese, `--lang`), adds a fresh panel
  screenshot and where its key rows sit, and passes it all in `?data=`. It then seeks the timeline frame by frame
  into docs/assets/demo.gif (English) or docs/assets/demo.zh-CN.gif.
  The page holds no content of its own. Every state is a pure function of the time t (a small keyframe engine at the
  end, no third-party code), so a seek always draws the same frame. Frame 0 is the cover; the clip ends on it again.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>agent-env demo</title>
    <style>
      :root {
        /* Light, after the panel (docs/assets/panel.png): warm paper, white surfaces, its green as the accent. */
        --bg: #f5f4ef;
        --surface: #ffffff;
        --bar: #f3f3f0;
        --line: #e2e1da;
        --text: #1f2328;
        --muted: #6e7781;
        --faint: #a2a9b1;
        --accent: #43721d;
        --accent-soft: #43721d14;
        --blue: #0969da;
        --purple: #8250df;

        --mono: ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', 'PingFang SC', 'Hiragino Sans GB',
          'Noto Sans Mono CJK SC', 'Microsoft YaHei', monospace;
        --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC',
          'Microsoft YaHei', sans-serif;
        --round: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Arial Rounded MT Bold', -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 760px;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--ui);
        color: var(--text);
        perspective: 1600px;
      }
      .abs {

      }
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
      }
      #g0 {
        left: -180px;
        top: -260px;
        width: 720px;

      }
      #g1 {
        right: -200px;

      /* Captions: a command chip and one line. */
      .cap {

      .cursor {
        display: inline-block;
        width: 0.6em;

        background: var(--acc, var(--accent));

      }

      }
      .cmd {

      }

      }

      }

      }

      }

      /* Browser window around the panel. */
      #browser {
        position: absolute;
        left: 90px;
        top: 100px;
        width: 1100px;
        height: 630px;
        border: 1px solid #d9d8d1;
        border-radius: 14px;
        background: #f7f7f5;
        box-shadow:
          0 1px 2px #0000000f,
          0 40px 90px -30px #2b2a2466,
          0 0 120px -50px #0969da66;
        overflow: hidden;
      }
      #browser .bar {
        z-index: 2;
      }
      .url {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 18px;

      }

      }

      }

      }
      #ring {

        border-radius: 10px;

          0 0 0 4px #b4530922,

      }

      /* Cover and closing frame, after docs/assets/banner.jpg. */
      #cover {
        position: absolute;
        inset: 0;
      }
      .word {
        position: absolute;
        left: 0;
        right: 0;
        top: 46px;

      }
      .tagline {
        position: absolute;
        left: 0;

      #scroll {

        border-radius: 18px;
        background: linear-gradient(#fffdf6, #fbf4e4);
        box-shadow:
          0 1px 2px #0000000f,

      }
      #scroll .fname {

          0 1px 2px #0000000f,

      }
      .tile svg.icon {

      .tile .name {

      }

      .repo span {

        border: 1px solid #d9d8d1;

  </head>
  <body>
    <div id="stage">
      <div class="glow" id="g0"></div>
      <div class="glow" id="g1"></div>
      <div class="glow" id="g2"></div>
      <div id="dots"></div>
    </div>
    <script>
      const stage = document.getElementById('stage')
      const params = new URLSearchParams(location.search)
      const data = params.has('data') ? JSON.parse(params.get('data')) : null

      // ── keyframe engine: every state is a function of t ──
      const clamp01 = (x) => Math.min(1, Math.max(0, x))
      const ease = {
        out: (x) => 1 - (1 - x) ** 3,
        in: (x) => x ** 3,
        inOut: (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2),
        linear: (x) => x,
        // A damped spring that settles by x = 1; `b` sets how far it overshoots.
        spring: (b = 1) => (x) => (x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(x * Math.PI * b)),
      }
      const DEFAULT = { o: 1, x: 0, y: 0, s: 1, rx: 0, ry: 0, b: 0 }
      const tracks = new Map()
      const fns = []
      // Animate `node` towards `to` from `at` for `dur` seconds; `from` also sets the state before `at`.
      function add(node, to, { at, dur = 0.4, ease: e = ease.out, from } = {}) {
        if (!tracks.has(node)) tracks.set(node, [])
        tracks.get(node).push({ to, at, dur, e, from })
      }
      function apply(node, segs, t) {
        const st = { ...DEFAULT }
        const first = [...segs].sort((a, b) => a.at - b.at)
        if (first[0]?.from) Object.assign(st, first[0].from)
        for (const seg of first) {
          if (t < seg.at) break
          const p = seg.e(clamp01((t - seg.at) / seg.dur))
          for (const [k, v] of Object.entries(seg.to)) {
            const f = seg.from?.[k] ?? st[k]
            st[k] = f + (v - f) * p
          }
        }
        node.style.opacity = st.o
        node.style.visibility = st.o < 0.003 ? 'hidden' : 'visible'
        node.style.transform = `translate3d(${st.x}px, ${st.y}px, 0) scale(${st.s}) rotateX(${st.rx}deg) rotateY(${st.ry}deg)`
        node.style.filter = st.b > 0.05 ? `blur(${st.b}px)` : ''
      }
      function seekAll(t) {
        for (const [node, segs] of tracks) apply(node, segs, t)
        for (const f of fns) f(t)
      }
      const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))

      // ── text ──
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
      // East Asian wide characters take two terminal columns; the CLI aligns its tables that way.
      const WIDE =
        /[ᄀ-ᅟ⺀-〾ぁ-㏿㐀-䶿一-鿿ꀀ-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦]/
      const cells = (s) => [...s].map((ch) => (WIDE.test(ch) ? `<span class="w">${esc(ch)}</span>` : esc(ch))).join('')
      const span = (cls, s) => (cls ? `<span class="${cls}">${cells(s)}</span>` : cells(s))
      const VIS = /\b(public|personal|company|local)\b/
      const STATE = {
        synced: 'ok', customized: 'info', missing: 'bad', drift: 'warn', unknown: 'faint',
        已同步: 'ok', 已定制: 'info', 缺失: 'bad', 不一致: 'warn', 未知: 'faint',
      }
      // Colour one line of real output by what kind of output it is. The words stay as printed.
      function paint(line, mode) {
        if (mode === 'toml') {
          if (line === '--') return span('faint', line)
          if (/^\[.*\]$/.test(line)) return span('sect', line)
          const m = /^(\w+)( = )(.*)$/.exec(line)
          if (!m) return cells(line)
          const v = VIS.exec(m[3])?.[1]
          return span('dim', m[1]) + span('faint', m[2]) + span(m[1] === 'visibility' && v ? `v-${v}` : 'str', m[3])
        }
        if (mode === 'tsv') {
          return line
            .split('\t')
            .map((c, i) => {
              if (STATE[c]) return span(STATE[c], c)
              if (i === 0) return span('strong', c)
              if (VIS.test(c) && c.length < 10) return span(`v-${c}`, c)
              return span('dim', c)
            })
            .join('\t')
        }
        if (mode === 'json') {
          return esc(line)
            .replace(/"(\w+)":/g, '<span class="dim">"$1":</span>')
            .replace(/"(synced|customized|missing|drift|unknown)":<\/span>(\d+)/g, (_, k, n) => `"${k}":</span><span class="${STATE[k]} strong">${n}</span>`)
        }
        if (mode === 'md') {
          if (/^#/.test(line)) return span('head', line)
          if (/^- /.test(line)) return span('faint', '- ') + cells(line.slice(2))
          if (/^\|/.test(line)) return span('dim', line)
          return cells(line)
        }
        if (mode === 'cli') {
          let m
          if ((m = /^(PASS|WARN|FAIL)( \[\w+\])?(.*)$/.exec(line))) {
            return span({ PASS: 'ok', WARN: 'warn', FAIL: 'bad' }[m[1]] + ' strong', m[1]) + span('faint', m[2] ?? '') + fixed(m[3])
          }
          if ((m = /^(\s+)(已同步|已定制|缺失|不一致|未知)(.*)$/.exec(line))) return cells(m[1]) + span(STATE[m[2]], m[2]) + fixed(m[3])
          if (/^(落点|环境|合计|清单检查)/.test(line)) return span('strong', line)
          return fixed(line)
        }
        return cells(line)
      }
      const fixed = (s) => {
        const i = s.indexOf('修复：')
        return i < 0 ? cells(s) : cells(s.slice(0, i)) + span('fix', s.slice(i))
      }

      function el(tag, cls, parent = stage, html) {
        const node = document.createElement(tag)
        if (cls) node.className = cls
        if (html !== undefined) node.innerHTML = html
        parent.appendChild(node)
        return node
      }

      // ── pieces ──
      const CHAR = 0.026
      const SLIDE_FROM = { o: 0, x: -14, b: 3 }
      function caption(chip, title, inAt, outAt) {
        const c = el('div', 'cap', stage, `<span class="tag">${esc(chip)}</span><span>${esc(title)}</span>`)
        add(c, { o: 1, y: 0, b: 0 }, { from: { o: 0, y: 12, b: 6 }, at: inAt, dur: 0.5 })
        if (outAt != null) add(c, { o: 0, y: -12, b: 6 }, { at: outAt, dur: 0.35, e: ease.in })
        return c
      }
      // A terminal: commands typed with a cursor, then output lines sliding in. Returns when its output is done.
      function terminal(box, spec, start, size) {
        const t = el('div', 'term')
        Object.assign(t.style, box)
        if (spec.accent) t.style.setProperty('--acc', spec.accent)
        t.innerHTML = `<div class="bar"><i></i><i></i><i></i><span class="title"><b>${esc(spec.env)}</b>  ${esc(spec.path)}</span><span class="live"><em></em><span class="state">running</span></span></div><div class="body"><div class="lines"></div></div>`
        const lines = t.querySelector('.lines')
        const lh = Math.round(size * 1.55)
        lines.style.fontSize = `${size}px`
        lines.style.lineHeight = `${lh}px`
        const live = t.querySelector('.live')
        const stateLabel = t.querySelector('.state')
        const cursor = el('span', 'cursor', document.createElement('div'))
        const stops = [] // [time, line node or null]: where the cursor sits from that time
        const shown = [] // [time, rows] for scrolling
        let at = start
        const marks = []
        const markRe = spec.mark ? new RegExp(spec.mark) : null
        const markSet = new Set(spec.markLines ?? [])
        const prompt = () => el('div', 'ln', lines, '<span class="tx"><span class="prompt">$</span> <span class="cmd"></span></span>')
        let firstPrompt = prompt()
        stops.push([0, firstPrompt])
        shown.push([0, 1])
        let rows = 1
        let runningFrom = null
        let runningTo = null
        spec.steps.forEach((step, k) => {
          const node = k === 0 ? firstPrompt : prompt()
          if (k > 0) {
            add(node, { o: 1 }, { from: { o: 0 }, at, dur: 0.15 })
            stops.push([at, node])
            rows++
            shown.push([at, rows])
          }
          const typed = node.querySelector('.cmd')
          const dur = Math.min(0.95, step.cmd.length * CHAR)
          const t0 = at + 0.12
          fns.push((now) => {
            const n = Math.round(step.cmd.length * clamp01((now - t0) / dur))
            typed.innerHTML = cells(step.cmd.slice(0, now < t0 ? 0 : n))
          })
          at = t0 + dur + 0.18
          if (runningFrom === null) runningFrom = at
          stops.push([at, null])
          const every = Math.min(0.055, 0.8 / Math.max(1, step.lines.length))
          step.lines.forEach((line) => {
            const ln = el('div', `ln${step.wrap ? ' wrap' : ''}`, lines, `<span class="tx">${paint(line, step.mode) || '&nbsp;'}</span>`)
            add(ln, { o: 1, x: 0, b: 0 }, { from: SLIDE_FROM, at, dur: 0.25 })
            if ((markRe && markRe.test(line)) || markSet.has(line)) marks.push(ln)
            rows++
            shown.push([at, rows])
            at += every
          })
          at += 0.22
        })
        runningTo = at
        add(live, { o: 1, x: 0 }, { from: { o: 0, x: 10 }, at: runningFrom - 0.1, dur: 0.35 })
        fns.push((now) => {
          stateLabel.textContent = now < runningTo ? 'running' : 'done'
          live.querySelector('em').style.background = now < runningTo ? '' : '#a2a9b1'
          live.querySelector('em').style.boxShadow = now < runningTo ? '' : 'none'
        })
        const markAt = at
        marks.forEach((ln, i) => {
          const band = el('div', 'band', ln)
          ln.prepend(band)
          add(band, { o: 1, s: 1 }, { from: { o: 0, s: 0.98 }, at: markAt + i * 0.06, dur: 0.35 })
        })
        // The cursor follows the last stop; lines above the window scroll away smoothly.
        const cap = Math.floor((parseFloat(box.height) - 42 - 28) / lh)
        fns.push((now) => {
          let where = null
          for (const [time, node] of stops) if (time <= now) where = node
          if (where) where.querySelector('.tx').appendChild(cursor)
          else cursor.remove()
          let n = 0
          for (const [time, r] of shown) if (time <= now) n = Math.min(r, r - 1 + clamp01((now - time) / 0.2))
          lines.style.transform = `translateY(${-Math.max(0, n - cap) * lh}px)`
        })
        return { node: t, end: at + (marks.length ? 0.35 : 0) }
      }

      // ── scenes ──
      function termScene(sc, s) {
        const two = sc.layout === 'two'
        // Rows each window prints: a prompt per command plus its output. Short output gets bigger type and a
        // shorter window, as a real terminal would sit on the desk.
        const rows = Math.max(...sc.terms.map((t) => t.steps.reduce((n, st) => n + 1 + st.lines.length, 0)))
        const size = sc.size ?? (two ? 13.5 : rows <= 10 ? 19 : rows <= 16 ? 17 : rows <= 22 ? 16 : 14)
        const lh = Math.round(size * 1.55)
        const hpx = Math.min(652, Math.max(330, 42 + 28 + rows * lh + 18))
        const h = `${hpx}px`
        // A shorter window sits a little above the middle of the space under the caption.
        const top = `${88 + Math.round((652 - hpx) * 0.42)}px`
        const boxes = two
          ? [
              { left: '52px', top, width: '578px', height: h },
              { left: '650px', top, width: '578px', height: h },
            ]
          : [{ left: '70px', top, width: '1140px', height: h }]
        let end = s
        const terms = sc.terms.map((spec, i) => {
          const term = terminal(boxes[i], spec, s + 0.4 + i * 0.3, size)
          const side = two ? (i === 0 ? 1 : -1) : 0
          add(
            term.node,
            { o: 1, x: 0, y: 0, s: 1, rx: 0, ry: 0 },
            {
              from: two ? { o: 0, x: 90 * side, y: 30, s: 0.9, ry: 18 * side } : { o: 0, y: 50, s: 0.95, rx: -12 },
              at: s,
              dur: 0.4,
              e: ease.spring(0.8),
            },
          )
          end = Math.max(end, term.end)
          return term
        })
        const out = end + (sc.hold ?? 0.7)
        caption(sc.chip, sc.title, s + 0.15, out)
        terms.forEach((term) => add(term.node, { o: 0, y: -24, s: 0.96, rx: 10 }, { at: out, dur: 0.2, e: ease.in }))
        return out + 0.22
      }

      function panelScene(sc, s) {
        const P = sc.panel
        const b = el('div', '', stage)
        b.id = 'browser'
        b.innerHTML = `<div class="bar"><i></i><i></i><i></i><span class="url">${esc(P.url)}</span></div><div id="viewport"><div id="zoom"><img alt="" src="${P.src}"><div id="ring"></div></div></div>`
        add(b, { o: 1, y: 0, s: 1, rx: 0 }, { from: { o: 0, y: 60, s: 0.94, rx: 14 }, at: s, dur: 0.45, e: ease.spring(0.8) })
        // Push in on the rows that matter, then ring them.
        const [fx, fy, fw, fh] = P.focus
        const k = Math.min(1.55, 1060 / fw, 560 / fh)
        const lim = (v, lo, hi) => Math.min(hi, Math.max(lo, v))
        const zx = lim(550 - (fx + fw / 2) * k, 1100 - 1100 * k, 0)
        const zy = lim(294 - (fy + fh / 2) * k, 588 - P.height * k, 0)
        const tZoom = s + 0.9
        add(b.querySelector('#zoom'), { s: k, x: zx, y: zy }, { from: { s: 1, x: 0, y: 0 }, at: tZoom, dur: 0.8, e: ease.inOut })
        const ring = b.querySelector('#ring')
        const place = ([x, y, w, h]) => Object.assign(ring.style, { left: `${x - 6}px`, top: `${y - 4}px`, width: `${w + 12}px`, height: `${h + 8}px` })
        place(P.ring)
        add(ring, { o: 1, s: 1 }, { from: { o: 0, s: 1.4 }, at: tZoom + 0.95, dur: 0.6, e: ease.spring(1.2) })
        const tMove = tZoom + 1.85
        if (P.ring2) {
          const [a, c] = [P.ring, P.ring2]
          fns.push((now) => {
            const p = ease.inOut(clamp01((now - tMove) / 0.7))
            place(a.map((v, i) => v + (c[i] - v) * p))
          })
        }
        const out = tMove + (P.ring2 ? 1.2 : 0.9)
        caption(sc.chip, sc.title, s + 0.15, out)
        add(b, { o: 0, y: -24, s: 0.96 }, { at: out, dur: 0.2, e: ease.in })
        return out + 0.22
      }

      // Cover: the wordmark, the manifest and the four kinds of target it reaches. Frame 0 shows it whole.
      const ICONS = {
        laptop:
          '<svg class="icon" viewBox="0 0 80 80"><rect x="12" y="16" width="56" height="38" rx="5" fill="#2b3240"/><rect x="18" y="22" width="20" height="4" rx="2" fill="#7ee787"/><rect x="18" y="30" width="34" height="4" rx="2" fill="#79c0ff"/><rect x="18" y="38" width="26" height="4" rx="2" fill="#d2a8ff"/><rect x="18" y="46" width="30" height="4" rx="2" fill="#ffa657"/><path d="M6 58h68l-5 7H11z" fill="#9aa4b2"/></svg>',
        terminal:
          '<svg class="icon" viewBox="0 0 80 80"><rect x="8" y="14" width="64" height="50" rx="7" fill="#2b3240"/><rect x="8" y="14" width="64" height="11" rx="7" fill="#3a4354"/><circle cx="16" cy="19.5" r="2.4" fill="#ff5f57"/><circle cx="23" cy="19.5" r="2.4" fill="#febc2e"/><circle cx="30" cy="19.5" r="2.4" fill="#28c840"/><rect x="16" y="32" width="22" height="4" rx="2" fill="#7ee787"/><rect x="16" y="40" width="40" height="4" rx="2" fill="#79c0ff"/><rect x="16" y="48" width="30" height="4" rx="2" fill="#ffa657"/></svg>',
        server:
          '<svg class="icon" viewBox="0 0 80 80"><rect x="14" y="12" width="52" height="24" rx="5" fill="#5b5677"/><rect x="14" y="42" width="52" height="24" rx="5" fill="#5b5677"/><rect x="21" y="19" width="4" height="10" rx="2" fill="#c8c4dd"/><rect x="29" y="19" width="4" height="10" rx="2" fill="#c8c4dd"/><rect x="21" y="49" width="4" height="10" rx="2" fill="#c8c4dd"/><rect x="29" y="49" width="4" height="10" rx="2" fill="#c8c4dd"/><circle cx="56" cy="24" r="3.5" fill="#56d364"/><circle cx="56" cy="54" r="3.5" fill="#56d364"/></svg>',
        cloud:
          '<svg class="icon" viewBox="0 0 80 80"><path d="M22 60a14 14 0 0 1-2-27.8A18 18 0 0 1 55 26a13 13 0 0 1 4 34z" fill="#eaf3ff" stroke="#4f8fe6" stroke-width="3"/><rect x="26" y="38" width="18" height="4" rx="2" fill="#56d364"/><rect x="26" y="45" width="28" height="4" rx="2" fill="#4f8fe6"/><rect x="26" y="52" width="20" height="4" rx="2" fill="#ffa657"/></svg>',
      }
      const CHECK =
        '<svg class="check" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#dafbe1"/><path d="M7.5 13.5l3.6 3.6 7.4-8" fill="none" stroke="#1a7f37" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      const RIBBON = ['#2da44e', '#0969da', '#8250df', '#e8730c']
      function cover(c) {
        const root = el('div', '', stage)
        root.id = 'cover'
        el('div', 'word', root, 'agent-env')
        el('div', 'tagline', root, esc(c.tagline))
        const scroll = el('div', '', root, `<span class="fname">habits.toml</span>${'<div class="row"></div>'.repeat(5)}`)
        scroll.id = 'scroll'
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        svg.id = 'ribbons'
        root.appendChild(svg)
        const spots = [
          [606, 262],
          [930, 262],
          [606, 438],
          [930, 438],
        ]
        const tiles = c.tiles.map((tile, i) => {
          const [x, y] = spots[i]
          const node = el('div', 'tile', root, `${ICONS[tile.icon]}<div class="name">${esc(tile.name)}</div><div class="sub">${esc(tile.sub)}</div>${CHECK}`)
          Object.assign(node.style, { left: `${x}px`, top: `${y}px` })
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          const sx = 356
          const sy = [392, 380, 420, 432][i]
          // Left tiles take the ribbon on their left edge; right ones from above and below, round the left ones.
          const d = [
            `M${sx},${sy} C470,${sy} 490,328 ${x + 2},328`,
            `M${sx},${sy} C470,${sy} 470,238 640,238 L${x + 120},238 C${x + 150},238 ${x + 150},246 ${x + 150},${y + 2}`,
            `M${sx},${sy} C470,${sy} 490,504 ${x + 2},504`,
            `M${sx},${sy} C470,${sy} 470,600 640,600 L${x + 120},600 C${x + 150},600 ${x + 150},592 ${x + 150},${y + 130}`,
          ][i]
          p.setAttribute('d', d)
          p.setAttribute('stroke', RIBBON[i])
          p.setAttribute('pathLength', '1')
          p.setAttribute('stroke-dasharray', '1')
          svg.insertBefore(p, svg.firstChild)
          return { node, path: p }
        })
        el('div', 'repo', root, `<span>${esc(c.url)}</span>`)
        return { root, tiles, scroll }
      }

      // When each scene starts, for scripts/record-demo.ts to report.
      const starts = []
      function build(d) {
        const c = cover(d.cover)
        // Frame 0: the whole cover. It steps back as the first scene comes in.
        const leave = 1.3
        add(c.root, { o: 0, s: 1.02 }, { at: leave, dur: 0.25, e: ease.in })
        let s = leave + 0.15
        starts.length = 0
        d.scenes.forEach((sc) => {
          starts.push(Math.round(s * 10) / 10)
          s = sc.layout === 'panel' ? panelScene(sc, s) : termScene(sc, s)
        })
        // The closing frame is the cover again: the ribbons draw out from the manifest and land on each target.
        const back = s
        add(c.root, { o: 1, s: 1 }, { at: back, dur: 0.3 })
        c.tiles.forEach((tile, i) => {
          const tIn = back + 0.25 + i * 0.12
          add(tile.node, { o: 0, y: 12 }, { at: leave + 0.5, dur: 0.01 })
          add(tile.node, { o: 1, y: 0 }, { at: tIn + 0.4, dur: 0.3 })
          fns.push((now) => {
            const drawn = now < leave + 0.5 ? 1 : ease.inOut(clamp01((now - tIn) / 0.6))
            tile.path.setAttribute('stroke-dashoffset', String(1 - drawn))
          })
        })
        return back + 2.2
      }

      if (!data) {
        el('div', '', stage, 'This scene is filled by scripts/record-demo.ts: node scripts/record-demo.ts --frames 0').id = 'empty'
        window.demo = { total: 0, ready: Promise.resolve(true), seek: async () => {} }
      } else {
        document.documentElement.lang = data.lang === 'zh' ? 'zh-CN' : 'en'
        const total = build(data)
        const images = [...document.images].map((img) =>
          img.complete ? Promise.resolve() : new Promise((r) => img.addEventListener('load', r, { once: true })),
        )
        window.demo = {
          total,
          starts,
          ready: Promise.all([document.fonts.ready, ...images]).then(() => true),
          // Used by scripts/record-demo.ts: put the timeline at `t` seconds and wait for paint.
          async seek(t) {
            seekAll(t)
            await frame()
          },
        }
        seekAll(0)
        if (!params.has('record')) {
          // Opened by hand with data: play it in a loop.
          const t0 = performance.now()
          const tick = () => {
            seekAll(((performance.now() - t0) / 1000) % total)
            requestAnimationFrame(tick)
          }
          requestAnimationFrame(tick)
        }
      }
    </script>
  </body>
</html>
