# Starter manifest: one machine, one agent host. Copy the whole starter/ directory into your own private
# repository (README.md "Use it for your setup"), then change the three places marked CHANGE.
# Paths that start with ../ are relative to this file. Every key here is required by `bin/agent-env check`.
# A bigger example with four environments: examples/demo/manifest/habits.toml in the engine.

schema = 1
roles = ["cli", "bot", "cron", "remote"]
visibility = ["public", "private"]
plugin_owner = "your-name" # CHANGE: the author name written into plugins (a user name, never an email)

[sources]
rules_src = "../sources/agents-md" # where you edit rules: public.md, personal.md, local.md (one file per owner)
rules = "~/.claude/AGENTS.md"      # the full rules as the host reads them
docs = "../sources/docs"           # may stay empty
hooks = "../sources/hooks"         # may stay empty

# ── this machine ─────────────────────────────────────
# doctor recognises the machine by platform: "darwin" is macOS, "linux" is Linux.
# On WSL write platform = "linux" and add a line: wsl = true
[environments.my-machine]
platform = "darwin" # CHANGE: "darwin" or "linux"

# ── plugins ──────────────────────────────────────────
# A plugin is a set of rule sections with a visibility: public, personal, company or local.
# "personal" stays private; nothing is pushed anywhere until you add a repo and run `plugin publish --yes`.
[plugins.my-rules]
visibility = "personal"
description = "My rules"
sections = ["__preamble__", "Communication"]

# ── the agent host on this machine ───────────────────
# CHANGE (only when the host is not Claude Code):
#   Codex:      id = "my-machine/codex", host = "codex", rules_output = "~/.codex/AGENTS.md",
#               rule_limit_bytes = 32768, and delete the `contains` expectation below.
#   another host: find where it reads its rules first (skills/agent-env/SKILL.md, section 3).
[[targets]]
id = "my-machine/claude-code"
host = "claude-code"
env = "my-machine"
roles = ["cli"]
rule_limit_bytes = 0   # 0 = no size limit
verified = false       # set to true after you have seen the host load the rules
eval_skip = "starter"
plugins = ["my-rules"]
rules_output = "~/.claude/AGENTS.md" # doctor compares this file; `render --target ... --write` writes it

# Claude Code reads ~/.claude/CLAUDE.md; this line in it loads the composed AGENTS.md.
[[targets.expect]]
kind = "contains"
habit = "rules"
name = "AGENTS.md"
path = "~/.claude/CLAUDE.md"
text = "@AGENTS.md"

[[targets.expect]]
kind = "composed"
habit = "rules"
name = "AGENTS.md 合成"

# ── rule sections: every `## ` heading of the rules source, with roles and visibility ──
# "__preamble__" is the text before the first heading. A new heading in sources/agents-md/ needs an entry here
# and a place in a plugin's `sections`.
[rule_sections."__preamble__"]
roles = ["cli", "bot", "cron", "remote"]
visibility = "private"

[rule_sections."Communication"]
roles = ["cli", "bot", "cron", "remote"]
visibility = "private"
